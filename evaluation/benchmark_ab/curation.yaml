# Decisões de curadoria do ground truth sihrd9 (benchmark A x B).
#
# Princípios:
#   1. O gold é a resposta CORRETA segundo os dados do sihrd9.
#   2. Alternativas (`alternatives`) só para ambiguidade de INTERPRETAÇÃO da
#      pergunta (data de entrada x alta, residência x atendimento, contagem por
#      internação x por linha de procedimento, definição clínica não dada).
#      Erro de manipulação de dado (placeholder, rótulo trocado, DF subcontado)
#      não ganha alternativa.
#   3. O gold devolve só o que a pergunta pede. `compare_columns` lista as
#      colunas do gold que a predição precisa reproduzir; as demais são de apoio.
#      Rótulos construídos por CASE (faixa etária, especialidade, tipo de parto)
#      ficam fora da comparação de execução e são checados na resposta em NL.
#   4. DF: `municipios` só tem 530010 (Brasília). Os códigos 5300xx de regiões
#      administrativas, usados no fato e em hospital, são Brasília.
#
# Campos: action (keep|rewrite|drop|answerable), reason, question, sql,
# alternatives, compare_columns, answerable, must_mention, date_alternative.

# --------------------------------------------------------------------------
# PROC_REA saiu do fato: procedimento agora vem de internacao_procedimento.
# "Procedimentos mais realizados" admite contagem por internação (DISTINCT
# N_AIH) ou por linha; as duas são aceitas.
# --------------------------------------------------------------------------
proc_top5:
  action: rewrite
  reason: "PROC_REA não existe mais em internacao; procedimento migrado para internacao_procedimento. Aceita contagem por internação ou por linha."
  sql: |
    SELECT p.NOME_PROC AS procedimento, COUNT(DISTINCT ip.N_AIH) AS total
    FROM internacao_procedimento ip JOIN procedimentos p ON ip.PROC_REA = p.PROC_REA
    GROUP BY 1 ORDER BY total DESC LIMIT 5
  alternatives:
    - |
      SELECT p.NOME_PROC AS procedimento, COUNT(*) AS total
      FROM internacao_procedimento ip JOIN procedimentos p ON ip.PROC_REA = p.PROC_REA
      GROUP BY 1 ORDER BY total DESC LIMIT 5

